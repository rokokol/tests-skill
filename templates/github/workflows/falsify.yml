# The defect list, run through t.sh falsify on the default branch and by hand. Not on pull
# requests: it costs one suite run per defect, and --since, the filter a pull request would
# take, is not a proof. A survivor fails its shard, so the badge is the last full verdict
name: falsify

on:
  push:
    # >>> EXAMPLE: the repository's default branch
    branches: [master]
    # <<<
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every shard reports: one survivor must not cancel the runs that would find the rest
      fail-fast: false
      matrix:
        # Only the length of this list matters; job-total below reads it, so the width
        # is written once and widening the matrix needs no other edit
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      # >>> EXAMPLE: the toolchain the suite needs, from the repository's lockfile, where
      # its vendored t.sh sits, and the command that runs the suite
      - uses: cachix/install-nix-action@v31
      - name: one shard of the defect list
        run: nix develop --no-write-lock-file -c ./tests/t.sh falsify --shard "$((SHARD_INDEX + 1))/$SHARD_TOTAL" -- ./tests/check.sh behaviour
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
      # <<<
