# This repository's testing POLICY, read by t.sh from ./tests/t.conf.
#
# Copy to tests/t.conf and edit. It is read from the current directory only — there is no
# search up the tree, because a config found three directories away is a config nobody
# knew was in effect. T_CONFIG=path reads another file; T_CONFIG= (empty) ignores it.
#
# IT NEVER CARRIES THE COMMAND. What gets run stays after `--`, in the line you typed, so
# nobody has to open a file to find out what a green run was green about. Policy is what
# stays the same between runs; the command is what changes every time.
#
# Format: `key value`, one per line. The value is the rest of the line, verbatim, spaces
# included. Blank lines and lines starting with # are ignored. An unknown key is refused
# rather than skipped — a typo that is ignored is a policy silently not in effect, which
# is worse than no config at all.
#
# What you pass on the command line ADDS to this: `-m` and `-p` append, `-l` and T_ALLOW
# override.

# markers  NAME-or-path   a marker set to apply beside markers/default.txt. Repeatable.
#                         A bare name is one of the sets in markers/ beside t.sh, the file
#                         name without .txt; anything else is a path, relative to where you
#                         run t.sh from — `markers tests/markers.txt` for your own file.
# >>> EXAMPLE
markers   rust
# <<<

# pattern  TEXT           one more marker, for a line only this repository produces.
#                         Repeatable. Matched case-insensitively as a fixed string.
# >>> EXAMPLE
pattern   thread 'main' panicked
# <<<

# allow    REGEX          extended regex; matching lines are dropped before the scan.
#                         Given once. This is the escape hatch for a marker your repository
#                         genuinely expects — a negative test asserting a traceback — and
#                         the line naming it documents the exception where it will be read.
# >>> EXAMPLE
allow     expected: no tests ran|deliberate traceback in test_errors
# <<<

# logdir   PATH           where run keeps its logs. Default .test-logs; add it to
#                         .gitignore, and falsify.out/ beside it, which is where falsify
#                         leaves what it found. T_LOGDIR and -l override this.
# >>> EXAMPLE
logdir    .test-logs
# <<<
